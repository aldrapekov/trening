<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета участника | Угадай кто</title>
    
    <!-- Подключение внешнего файла стилей -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Подключение Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Подключение нашего внешнего файла скриптов (defer означает, что скрипт загрузится после HTML) -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Кнопка возврата в главный хаб -->
    <a href="index.html" class="back-button" data-i18n="homeBtn">
        🏠 Главная
    </a>

    <!-- Переключатель языков -->
    <div class="lang-switcher">
        <button onclick="setLanguage('kk')">KZ</button>
        <button onclick="setLanguage('ru')">RU</button>
        <button onclick="setLanguage('en')">EN</button>
    </div>

    <div class="form-container" id="formContainer">
        <h2 data-i18n="formTitle">Анкета инкогнито 🕵️‍♂️</h2>
        <p class="subtitle" data-i18n="formSubtitle">Заполните профиль. Ваше имя будет скрыто до самого конца!</p>
        
        <div class="form-group">
            <label data-i18n="labelName">Ваше Имя и Фамилия</label>
            <input type="text" id="qName" data-i18n-placeholder="placeName" placeholder="Например: Иван Иванов" required>
        </div>
        <div class="form-group">
            <label data-i18n="labelQ1">1. Ваша главная IT-суперспособность в школе?</label>
            <input type="text" id="q1" data-i18n-placeholder="placeQ1" placeholder="Чиню принтер взглядом..." required>
        </div>
        <div class="form-group">
            <label data-i18n="labelQ2">2. Если не информатика, то какой предмет вели бы?</label>
            <input type="text" id="q2" data-i18n-placeholder="placeQ2" placeholder="Физкультура, потому что..." required>
        </div>
        <div class="form-group">
            <label data-i18n="labelQ3">3. Как отдыхаете от мониторов на выходных?</label>
            <textarea id="q3" rows="2" data-i18n-placeholder="placeQ3" placeholder="Копаюсь в машине, играю в настолки..." required></textarea>
        </div>
        <div class="form-group">
            <label data-i18n="labelQ4">4. Любимая видеоигра, настолка или вселенная?</label>
            <input type="text" id="q4" data-i18n-placeholder="placeQ4" placeholder="D&D, CS2, Cyberpunk 2077..." required>
        </div>
        <div class="form-group">
            <label data-i18n="labelQ5">5. Ваше коронное блюдо для гостей?</label>
            <input type="text" id="q5" data-i18n-placeholder="placeQ5" placeholder="Пеку вафли, варю казы..." required>
        </div>
        <button onclick="submitForm()" data-i18n="submitBtn">Отправить инкогнито</button>
    </div>

    <div id="successMessage">
        <h2 data-i18n="successTitle">✅ Принято!</h2>
        <p data-i18n="successText">Ваша анкета улетела на главный экран.<br>Ждем начала игры!</p>
    </div>

</body>
</html>
